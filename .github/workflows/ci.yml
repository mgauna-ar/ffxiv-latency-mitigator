name: Build, Test & Release

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows MSVC x64 Standalone Build
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build All Targets
        run: |
          cmake --build build --config Release

      - name: Run Unit Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify Standalone Executable Exists
        run: |
          if (Test-Path "build\bin\Release\ffxiv-mitigator.exe") {
            Write-Host "ffxiv-mitigator.exe found in build\bin\Release"
          } else {
            Get-ChildItem -Path build -Recurse -Filter "*.exe"
            exit 1
          }

      - name: Upload Standalone Executable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffxiv-mitigator-windows-x64
          path: |
            build/bin/Release/ffxiv-mitigator.exe
            build/bin/Release/mitigator_payload.dll
          if-no-files-found: error

      - name: Package Release Zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "build\bin\Release\ffxiv-mitigator.exe", "build\bin\Release\mitigator_payload.dll" -DestinationPath "ffxiv-mitigator-windows-x64.zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ffxiv-mitigator-windows-x64.zip
          generate_release_notes: true

