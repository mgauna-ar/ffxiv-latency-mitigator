name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build All Targets
        run: |
          cmake --build build --config Release

      - name: Run Unit Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Verify Standalone Executable Exists
        run: |
          if (Test-Path "build\bin\Release\ffxiv-mitigator.exe") {
            Write-Host "ffxiv-mitigator.exe found in build\bin\Release"
          } else {
            Get-ChildItem -Path build -Recurse -Filter "*.exe"
            exit 1
          }

      - name: Package Release Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build\bin\Release\ffxiv-mitigator.exe", "build\bin\Release\mitigator_payload.dll" -DestinationPath "ffxiv-mitigator-windows-x64.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ffxiv-mitigator-windows-x64.zip
          generate_release_notes: true
